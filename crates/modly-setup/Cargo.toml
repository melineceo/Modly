[package]
name = "modly-setup"
description = "Modly installer, updater and uninstaller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
build = "build.rs"

# Установщик: внутри — архив выпуска (MODLY_PAYLOAD при сборке, см. cargo xtask dist).
[[bin]]
name = "modly-setup"
path = "src/bin/setup.rs"

# Обновлятор и удаление: лежит рядом с modly.exe.
[[bin]]
name = "modly-updater"
path = "src/bin/updater.rs"

[dependencies]
modly-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
anyhow = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = "0.6"
rfd = { version = "0.17", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"
