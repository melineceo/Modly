[package]
name = "xtask"
description = "Modly release tooling: signing key, installer, update package and signed manifest"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
modly-core.workspace = true
anyhow = "1"
serde_json.workspace = true
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.3"
